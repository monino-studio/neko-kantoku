<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>猫さま監督官 👑</title><meta name="theme-color" content="#422043"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="猫さま監督官"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><style>
:root{font-family:'Hiragino Mincho ProN','Yu Mincho',Georgia,serif;color:#542b32;background:#3a1b42}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#422044,#6d3c65);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}main{max-width:920px;margin:auto;min-height:100vh;background:#fff4e9}.palace{position:relative;min-height:460px;background:linear-gradient(90deg,#3e173a22,#3e173a40),url('palace-bg.jpg') center 18%/cover;overflow:hidden;color:#fff}.palace:after{content:'';position:absolute;inset:auto 0 0;height:55px;background:linear-gradient(transparent,#fff4e9);pointer-events:none}.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:16px 19px;text-shadow:0 2px 8px #351b35}.top h1{margin:0;font-size:clamp(24px,5vw,40px);color:#ffebae;text-align:center;letter-spacing:.05em}.top small{display:block;text-align:center;color:#ffe6bb;font-size:12px}.round{border:2px solid #f7d693;border-radius:50%;width:46px;height:46px;background:#563348b8;color:#fff0bd;font-size:24px}.queen{position:relative;z-index:1;display:flex;align-items:end;justify-content:space-between;gap:4px;padding:5px 12px 20px}.queen img{width:min(64%,490px);height:350px;object-fit:cover;object-position:45% 30%;border:4px ridge #edc16d;border-radius:42% 42% 17px 17px;box-shadow:0 9px 28px #2b1328}.bubble{align-self:center;flex:1;background:#fffaf3ed;color:#5c3035;border:3px solid #dfb46b;border-radius:45% 45% 42% 42%;padding:24px 12px;text-align:center;font-size:clamp(14px,2.5vw,22px);font-weight:700;line-height:1.6;box-shadow:0 7px 20px #2c183b80}.mood{position:absolute;bottom:20px;right:20px;z-index:3;background:#fff4e8;border:2px solid #ddb67b;border-radius:25px;color:#733c50;padding:5px 12px;font-size:12px}.panel{position:relative;z-index:3;margin:-4px 12px 16px;padding:14px;background:linear-gradient(135deg,#fffaf5,#ffece5);border:5px double #d7a353;border-radius:26px;box-shadow:0 6px 22px #5b31533b}.tabs{display:flex;gap:5px;margin-bottom:13px}.tabs button{flex:1;min-width:0;padding:12px 3px;border:2px solid #d8a660;border-radius:17px;background:#fff9ef;color:#743b47;font-size:clamp(12px,2.7vw,19px);font-weight:bold}.tabs .selected{background:linear-gradient(#ffe5b5,#fff5e5);box-shadow:inset 0 -3px #e2b56d}.tabs #count{display:inline-block;background:#ee5d8e;color:#fff;border-radius:100%;padding:1px 7px}.form{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.form #task{flex:1;min-width:155px}.form input{border:1px solid #dfb9ac;border-radius:24px;padding:12px;background:white;color:#613b45}.form label{width:100%;font-size:13px;color:#795257}.form label input{margin-left:8px}.form button{border:2px solid #ce4d7a;background:linear-gradient(#ff9fc0,#e94e86);border-radius:25px;color:white;padding:10px 24px;font-weight:bold}.task{display:flex;align-items:center;gap:9px;background:#fffaf6;border-bottom:1px solid #e9c6ba;padding:12px 7px}.task .info{flex:1;min-width:0;overflow-wrap:anywhere}.task strong{font-size:clamp(14px,3.5vw,19px)}.task small{display:block;color:#a36d57;margin-top:5px}.task button{background:transparent;color:#995d51;border:1px solid #e5c4aa;border-radius:9px;padding:8px}.empty{text-align:center;padding:25px;color:#a16e72}.notice{display:grid;gap:12px}.notice label{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.notice button,.preview{border:1px solid #d6ac78;border-radius:14px;background:#8c5279;color:#fff;padding:12px}.preview{position:absolute;bottom:54px;right:18px;z-index:3;font-size:12px;padding:8px}.foot{text-align:center;font-size:11px;color:#805a63;padding:14px 20px 30px}.bottomnav{display:flex;justify-content:space-around;gap:8px;margin:12px 12px 0;padding:11px;border:5px double #d6a354;border-radius:25px;background:linear-gradient(#fffdf8,#ffede4)}.bottomnav button{border:0;background:transparent;color:#995d51;padding:9px;font-size:15px}.bottomnav button.selected{background:#f6b6cb;border-radius:20px}dialog{border:5px double #d6a354;border-radius:20px;max-width:min(94vw,520px);background:#fff8f1;color:#542b32;box-shadow:0 15px 60px #2714289e}dialog::backdrop{background:#210d25a8}dialog h2{margin-top:0}dialog select{padding:9px}dialog .notice{margin-top:14px}@media(max-width:540px){.palace{min-height:385px}.queen img{height:265px;width:62%}.queen{padding:5px 8px 22px}.bubble{padding:14px 7px;font-size:13px}.top h1{font-size:25px}.top{padding:12px 9px}.round{width:39px;height:39px}.mood{bottom:12px;right:12px}.preview{bottom:46px}.panel{margin:0 6px 12px;padding:9px}.task{flex-wrap:wrap}.form button{padding:10px 16px}}
</style></head><body><main><section class="palace"><div class="top"><button class="round" id="notice-open" onclick="document.getElementById('settings-dialog').showModal()" aria-label="通知">🔔</button><div><h1>♛ 猫さま監督官 ♛</h1><small>ねこさま かんとくかん</small></div><button class="round" id="settings-open" aria-label="設定">⚙</button></div><div class="queen"><img id="cat" src="normal.png" alt="ティアラとパールをまとった白い猫の女王さま"><div id="speech" class="bubble">今日の任務を申しつけるにゃ。</div></div><div id="mood" class="mood">👑 優雅にお待ちです</div><button class="preview" id="preview" type="button">表情を試す ♡</button></section><section class="panel"><div class="tabs"><button class="selected" data-tab="tasks">♛ 今日の任務 <span id="count">0</span></button><button data-tab="done">完了した任務</button><button data-tab="rewards">ご褒美</button></div><div id="tasks-panel"><form id="form" class="form"><input id="task" required maxlength="120" placeholder="やることを入力…"><button type="submit">＋ 追加</button><label>⏰ 締切（任意）<input type="datetime-local" id="deadline"></label></form><div id="list"></div></div><div id="rewards-panel" hidden></div></section><nav class="bottomnav" aria-label="メニュー"><button class="selected" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂ ホーム</button><button type="button" onclick="document.getElementById('task').focus()">☑ タスク</button><button type="button" onclick="document.getElementById('preview').click()">♛ 猫さま</button><button type="button" onclick="document.getElementById('settings-dialog').showModal()">⚙ 設定</button></nav><div class="foot">猫さま監督官 Ver.7 · 宮殿デザイン版<br>催促通知は画面を開いている間だけ。閉じた状態のプッシュ通知は今後対応予定です。</div></main><dialog id="settings-dialog"><h2>🔔 猫さまの催促設定</h2><div class="notice"><label>通知間隔 <select id="interval"><option value="1">1分（テスト用）</option><option value="5">5分</option><option value="15">15分</option><option value="30">30分</option></select></label><label><input id="quiet" type="checkbox" checked> 夜22時〜朝8時は通知しない</label><button id="enable" type="button">通知を有効にしてテスト送信</button><small id="status" aria-live="polite">タスクを追加すると催促するにゃ。</small><small>締切あり：締切後から催促します。アプリを閉じている間の通知は未対応です。</small></div><p style="text-align:right"><button id="settings-close" type="button">閉じる</button></p></dialog><script>
'use strict';
const KEY='nekoQueenV5', OLD='nekoQueenV3';
let tasks=[];try{const stored=localStorage.getItem(KEY);tasks=JSON.parse(stored!==null?stored:(localStorage.getItem(OLD)||'[]'));if(!Array.isArray(tasks))tasks=[];tasks=tasks.filter(t=>t&&typeof t.text==='string').map(t=>({...t,at:Number(t.at)||Date.now(),deadline:t.deadline||null}));}catch(e){tasks=[]}
const moods=[['normal','👑 猫さまは優雅にお待ちです','今日の任務を申しつけるにゃ。'],['annoyed','😒 猫さまはご不満です','……まだ終わってないのかにゃ？'],['sad','🥺 猫さまは悲しんでいます','猫さまを待たせるなんて……ひどいにゃ……'],['angry','💢 猫さまは激怒しています','下僕！！いつまで待たせるにゃ！！'],['happy','💖 猫さまはご機嫌です','よくやったにゃ♡ 褒めてつかわす！']];
const $=id=>document.getElementById(id);let celebrateUntil=0,preview=-1,autoCount=0,lastNotice=Date.now(),lastNoticeTaskKey='';
function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function dueAt(t){return t.deadline?new Date(t.deadline).getTime():t.at}
function pending(){return tasks.filter(t=>Date.now()>=dueAt(t))}
function level(){const active=pending();if(!active.length)return 0;const age=Date.now()-Math.min(...active.map(dueAt));return age>=180000?3:age>=120000?2:age>=60000?1:0}
function updateMood(){const index=preview>=0?preview:Date.now()<celebrateUntil?4:level();const m=moods[index];if($('cat').dataset.mood!==m[0]){$('cat').src=m[0]+'.png';$('cat').dataset.mood=m[0]}$('mood').textContent=m[1];$('speech').textContent=m[2]}
function render(){const list=$('list');list.replaceChildren();$('count').textContent=tasks.length;if(!tasks.length){const p=document.createElement('p');p.className='empty';p.textContent='任務はすべて完了にゃ ✨';list.append(p)}tasks.forEach(t=>{const row=document.createElement('div');row.className='task';const info=document.createElement('div');info.className='info';const name=document.createElement('strong');name.textContent=t.text;const time=document.createElement('small');if(t.deadline){const dt=new Date(t.deadline);time.textContent=Date.now()>=dt.getTime()?'⏰ 締切超過：'+dt.toLocaleString('ja-JP'):'⏰ 締切：'+dt.toLocaleString('ja-JP')}else time.textContent='⏰ 締切なし・催促中';info.append(name,time);const done=document.createElement('button');done.textContent='✓ 完了';done.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();celebrateUntil=Date.now()+15000;preview=-1;lastNotice=Date.now();render()};const del=document.createElement('button');del.textContent='削除';del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();lastNotice=Date.now();render()};row.append(info,done,del);list.append(row)});updateMood()}
$('form').onsubmit=e=>{e.preventDefault();const text=$('task').value.trim(),deadline=$('deadline').value;if(!text)return;const stamp=deadline?new Date(deadline).getTime():null;if(deadline&&!Number.isFinite(stamp)){alert('締切を確認してね');return}tasks.push({id:Date.now()+Math.random(),text,at:Date.now(),deadline:deadline||null});save();$('task').value='';$('deadline').value='';celebrateUntil=0;preview=-1;lastNotice=Date.now();render()};
$('preview').onclick=()=>{preview=(preview+1)%5;updateMood()};
$('interval').value=localStorage.getItem('nekoInterval')||'1';$('quiet').checked=localStorage.getItem('nekoQuiet')!=='false';$('interval').onchange=()=>{localStorage.setItem('nekoInterval',$('interval').value);lastNotice=Date.now()};$('quiet').onchange=()=>localStorage.setItem('nekoQuiet',String($('quiet').checked));
function quietNow(){const h=new Date().getHours();return $('quiet').checked&&(h>=22||h<8)}
function notifyCat(test=false){if(!('Notification'in window)||Notification.permission!=='granted')return false;if(!test&&(quietNow()||!pending().length))return false;const mood=moods[level()];try{const n=new Notification('👑 猫さま監督官',{body:test?'通知テストにゃ！猫さまはここにいるにゃ♡':mood[2],icon:(test?'normal':mood[0])+'.png',tag:'neko-'+Date.now()+'-'+Math.random()});n.onclick=()=>{window.focus();n.close()};if(!test)autoCount++;return true}catch(e){$('status').textContent='通知エラー：'+e.message;return false}}
$('enable').onclick=async()=>{if(!('Notification'in window)){$('status').textContent='このブラウザでは通知を使えません';return}let permission=Notification.permission;if(permission==='default')permission=await Notification.requestPermission();if(permission==='granted'){$('status').textContent='通知テストを送信しました';notifyCat(true)}else $('status').textContent='Chromeのサイト設定で通知を許可してね'};
function tick(){updateMood();const active=pending(),gap=Number($('interval').value)*60000;const key=active.map(t=>t.id).sort().join(',');if(key!==lastNoticeTaskKey){lastNoticeTaskKey=key;lastNotice=Date.now()}if(!tasks.length){$('status').textContent='任務完了！自動催促は停止中（送信 '+autoCount+'回）';return}if(!active.length){$('status').textContent='締切待ち：'+tasks.length+'件。締切になったら催促を始めるにゃ';return}if(quietNow()){$('status').textContent='おやすみ時間中：自動催促を停止しています';return}const remain=Math.max(0,Math.ceil((gap-(Date.now()-lastNotice))/1000));$('status').textContent='催促対象 '+active.length+'件・次の通知まで約'+remain+'秒・自動送信 '+autoCount+'回';if(Date.now()-lastNotice>=gap){if(Notification.permission==='granted')notifyCat(false);lastNotice=Date.now()}}
render();tick();setInterval(tick,1000);if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('SW registration failed',err)))}

const tabs=document.querySelectorAll('[data-tab]');tabs.forEach(b=>b.addEventListener('click',()=>{const name=b.dataset.tab;tabs.forEach(x=>x.classList.toggle('selected',x.dataset.tab===name));document.getElementById('tasks-panel').hidden=name==='rewards';document.getElementById('rewards-panel').hidden=name!=='rewards';if(name==='done'){document.getElementById('rewards-panel').hidden=false;document.getElementById('tasks-panel').hidden=true;document.getElementById('rewards-panel').innerHTML='<h2>👑 完了した任務</h2><p>完了の記録機能は次の更新で追加するにゃ♡</p>'}else if(name==='rewards'){document.getElementById('rewards-panel').innerHTML='<h2>🎁 ご褒美</h2><p>よく頑張った下僕には、猫さまが褒めてつかわす♡</p>'}}));
document.getElementById('settings-open').onclick=()=>document.getElementById('settings-dialog').showModal();document.getElementById('settings-close').onclick=()=>document.getElementById('settings-dialog').close();
</script></body></html>
