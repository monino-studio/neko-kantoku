</style></head><body><main><section class="palace"><div class="top"><button class="round" id="notice-open" onclick="document.getElementById('settings-dialog').showModal()" aria-label="通知">🔔</button><div class="brand"><div class="device-clock" id="device-clock" aria-label="現在時刻"></div><h1>♛ 猫さま監督官 ♛</h1><small>ねこさま かんとくかん</small></div><button class="round" id="settings-open" aria-label="設定">⚙</button></div><div class="queen"><div class="hero-cat"><img id="cat" src="01_normal.png" alt="玉座に座る猫さま"></div><div class="hero-side"><div id="speech" class="bubble">今日の任務を申しつけるにゃ。</div></div></div></div><div id="mood" class="mood">👑 優雅にお待ちです</div></section><div class="neko-scene-test"><label for="neko-demo-scene">🎭 猫さまの演出を見る（表示だけ） </label><select id="neko-demo-scene"><option value="auto">自動切り替え</option><option value="idle">通常</option><option value="groom">毛づくろい</option><option value="sleep">お昼寝</option><option value="tea">紅茶</option><option value="book">読書</option><option value="stretch">のび</option><option value="sulk">ご不満</option><option value="bunny">1時間</option><option value="chew">2時間</option><option value="bunny3">3時間</option><option value="target4">4時間</option><option value="doll5">5時間</option><option value="straw6">6時間</option><option value="cry7">7時間以降</option><option value="happy">完了・喜び</option><option value="smug">得意げ</option><option value="praise_yareba">褒め：やればできるじゃん</option><option value="praise_taihen">褒め：大変よくできました</option><option value="praise_keizoku">褒め：継続は力なり</option><option value="praise_marvelous">褒め：マーベラス</option><option value="praise_turtle">褒め：一歩前進</option><option value="praise_milk">褒め：やるじゃん？</option><option value="praise_erai">褒め：えらいじゃん？</option><option value="praise_kiraku">褒め：気楽に続ける</option></select></div><section class="panel"><div class="tabs"><button class="selected" data-tab="tasks">♛ 今日の任務 <span id="count">0</span></button><button data-tab="done">完了した任務</button><button data-tab="stats">🏆 継続記録</button></div><div id="tasks-panel"><form id="form" class="form"><input id="task" required maxlength="120" placeholder="やることを入力…"><button type="submit">＋ 追加</button><label>🔁 繰り返し<select id="repeat"><option value="once">1回だけ</option><option value="daily">毎日</option><option value="weekdays">平日のみ（月〜金）</option><option value="weekly">毎週（曜日を指定）</option></select></label><label id="weekday-wrap" hidden>曜日<select id="weekday"><option value="0">日曜日</option><option value="1">月曜日</option><option value="2">火曜日</option><option value="3">水曜日</option><option value="4">木曜日</option><option value="5">金曜日</option><option value="6">土曜日</option></select></label><label id="neko-deadline-wrap">📅 日付・時刻（1回だけ／任意）<input type="datetime-local" id="deadline"></label><label id="neko-time-wrap" hidden>⏰ 催促開始時刻（繰り返し）<input type="time" id="recurring-time" value="21:00" step="60"></label></form><div id="list"></div></div><div id="done-panel" hidden></div><div id="stats-panel" class="neko-stats" hidden></div></section><nav class="bottomnav" aria-label="メニュー"><button class="selected" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂ ホーム</button><button type="button" onclick="document.getElementById('task').focus()">☑ タスク</button><button type="button" onclick="document.getElementById('cat').scrollIntoView({behavior:'smooth',block:'center'})">♛ 猫さま</button><button type="button" onclick="document.getElementById('settings-dialog').showModal()">⚙ 設定</button></nav><div class="foot">猫さま監督官 Ver.9.3 テスト版 v9 · 褒め演出から自動復帰修正<br>繰り返し任務は決めた時刻から催促。クラウド通知は約5分間隔・日本時間22時〜8時は停止します。</div></main><dialog id="neko-praise-dialog" aria-labelledby="neko-praise-heading"><h2 id="neko-praise-heading">👑 猫さまのお褒めの言葉</h2><img id="neko-praise-popup-image" alt="任務完了を褒める猫さま"><p id="neko-praise-popup-message"></p><button id="neko-praise-popup-close" type="button">うれしいにゃ！ 閉じる</button></dialog><dialog id="settings-dialog"><h2>🔔 猫さまの催促設定</h2><div class="notice"><label>通知間隔 <select id="interval"><option value="1">1分（テスト用）</option><option value="5">5分</option><option value="15">15分</option><option value="30">30分</option></select></label><label><input id="quiet" type="checkbox" checked> 夜22時〜朝8時は通知しない</label><label>🎀 猫さまに呼ばれたい名前（任意）<input id="neko-nickname" maxlength="16" placeholder="例：みゆ（未入力なら下僕）" autocomplete="off"></label><button id="enable" type="button">通知を有効にしてテスト送信</button><small id="status" aria-live="polite">タスクを追加すると催促するにゃ。</small><small>指定時刻から催促します。クラウド通知の間隔は約5分（設定画面の通知間隔はアプリ起動中の催促用）。</small></div><p style="text-align:right"><button id="settings-close" type="button">閉じる</button></p></dialog><script>
'use strict';
const KEY='nekoQueenV5', OLD='nekoQueenV3';
let tasks=[];try{const stored=localStorage.getItem(KEY);tasks=JSON.parse(stored!==null?stored:(localStorage.getItem(OLD)||'[]'));if(!Array.isArray(tasks))tasks=[];tasks=tasks.filter(t=>t&&typeof t.text==='string').map(t=>({...t,at:Number(t.at)||Date.now(),deadline:t.deadline||null}));}catch(e){tasks=[]}
// 最初は可愛く、放置が続くほど辛口に。最終警告は開始30〜35分の1回だけ。
const moods=[
 ['normal','👑 猫さまは優雅にお待ちです','今日の任務を申しつけるにゃ。'],
 ['annoyed','😒 猫さまはご不満です','……まだ終わってないのかにゃ？'],
 ['sad','🥺 猫さまは悲しんでいます','猫さまを待たせるなんて……ひどいにゃ……'],
 ['lecture','😾 猫さまはお説教中です','習慣化して理想の自分になるためじゃないのかにゃ？'],
 ['angry','💢 猫さまは激怒しています','下僕！！いつまで待たせるにゃ！！さっさと片付けたほうが楽だにゃ？'],
 ['final','🔥 猫さまの最終警告','怠けてきたから今みたいないまいちな現実を迎えているんじゃないのかにゃ？'],
 ['happy','💖 猫さまはご機嫌です','よくやったにゃ♡ 褒めてつかわす！']
];
const $=id=>document.getElementById(id);let celebrateUntil=0,celebrateMessage='',preview=-1,autoCount=0,lastNotice=Date.now(),lastNoticeTaskKey='';
function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function dateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function scheduled(t,d=new Date()){
 const r=t.repeat||'once';if(r==='once')return true;
 const created=dateKey(new Date(t.at));if(dateKey(d)<created)return false;
 if(r==='weekdays')return d.getDay()>=1&&d.getDay()<=5;
 if(r==='weekly')return d.getDay()===Number(t.weekday);
 return true;
}
function completedToday(t){return t.repeat&&t.repeat!=='once'&&t.lastDone===dateKey()}
function doneToday(){return tasks.filter(t=>t.repeat==='once-done'||(scheduled(t)&&completedToday(t)))}
// 達成履歴は端末内に保存。旧版の lastDone も1回分として数える。
function completedDates(t){
 const history=Array.isArray(t.doneHistory)?t.doneHistory:[];
 const all=[...history,t.lastDone].filter(x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x));
 return [...new Set(all)].sort();
}
function isRepeatDay(t,d){
 const repeat=t.repeat;
 return repeat==='daily'||(repeat==='weekdays'&&d.getDay()>=1&&d.getDay()<=5)||
        (repeat==='weekly'&&d.getDay()===Number(t.weekday));
}
function getTaskStreak(t){
 if(!['daily','weekdays','weekly'].includes(t.repeat))return 0;
 const done=new Set(completedDates(t));
 const today=new Date();today.setHours(12,0,0,0);
 const first=new Date(Number(t.at)||Date.now());first.setHours(0,0,0,0);
 let count=0;
 // 今日がまだ未達成でも、前回までの連続記録は日付が変わるまで保持。
 let skippedCurrent=false;
 for(let d=new Date(today),i=0;i<36600&&d>=first;i++,d.setDate(d.getDate()-1)){
   if(!isRepeatDay(t,d))continue;
   const day=dateKey(d);
   if(!skippedCurrent&&day===dateKey(today)&&!done.has(day)){
     skippedCurrent=true;continue;
   }
   if(done.has(day))count++;
   else break;
 }
 return count;
}
function getTotalCompletions(t){return completedDates(t).length;}
// 正式採用の8種類。画像とセリフは必ずセットで切り替える。
const PRAISE_SCENES = [
 {key:'praise_yareba', text:'やればできるじゃん'},
 {key:'praise_keizoku', text:'継続は力なり！'},
 {key:'praise_marvelous', text:'天才、秀才、マーベラス！'},
 {key:'praise_turtle', text:'一歩前進だにゃ'},
 {key:'praise_milk', text:'やるじゃん？'},
 {key:'praise_erai', text:'えらいじゃん？'},
 {key:'praise_kiraku', text:'まあ気楽に続けるにゃ'},
];
const SPECIAL_PRAISE = {key:'praise_taihen', text:'大変よくできました'};
let lastPraiseSceneKey = '';
function praiseFor(t){
 // 本日完了した後の達成回数を確認。初回は特別賞を出さない。
 const streak = ['daily','weekdays','weekly'].includes(t.repeat) ? getTaskStreak(t) : 0;
 // 継続達成時のみ約1/4の確率で特別な賞状。
 const allowSpecial = streak >= 2 && Math.random() < 0.25;
 const possible = allowSpecial ? [...PRAISE_SCENES, SPECIAL_PRAISE] : PRAISE_SCENES;
 const choices = possible.filter(x => x.key !== lastPraiseSceneKey);
 const chosen = choices[Math.floor(Math.random() * choices.length)] || possible[0];
 lastPraiseSceneKey = chosen.key;
 return {key:chosen.key, text:chosen.text, streak};
}
function activeTasks(){return tasks.filter(t=>t.repeat!=='once-done'&&scheduled(t))}
function dueAt(t){
 if(!t.repeat||t.repeat==='once')return t.deadline?new Date(t.deadline).getTime():t.at;
 const d=new Date();if(t.deadline){const deadline=new Date(t.deadline);d.setHours(deadline.getHours(),deadline.getMinutes(),0,0)}else d.setHours(0,0,0,0);
 return d.getTime();
}
function pending(){return activeTasks().filter(t=>!completedToday(t)&&Date.now()>=dueAt(t))}
// 催促開始からの経過時間で判定（時刻は端末のローカル時間）。
// 30〜35分だけ最終警告、その後はLv.4とLv.5を交互に表示。
function nagLevelForElapsedMinutes(minutes){
 if(minutes<5)return 0;
 if(minutes<10)return 1;
 if(minutes<15)return 2;
 if(minutes<20)return 3;
 if(minutes<30)return 4;
 if(minutes<35)return 5;
 return Math.floor((minutes-35)/5)%2===0?3:4;
}
function level(){
 const active=pending();if(!active.length)return 0;
 const minutes=Math.max(0,Math.floor((Date.now()-Math.min(...active.map(dueAt)))/60000));
 return nagLevelForElapsedMinutes(minutes);
}
const catImages=['assets/normal.webp','assets/sulk.webp','assets/sulk.webp','assets/bunny.webp','assets/chew.webp','assets/bunny3.webp','assets/happy.webp'];
const NEKO_SCENES={
  idle:['normal.webp','👑 猫さまは優雅にお待ちです','今日の任務を申しつけるにゃ。'],
  sleep:['sleep.webp','💤 猫さまはお昼寝中です','……すやすや……'],
  groom:['groom.webp','🐾 毛づくろい中','美しさも日々の積み重ねにゃ。'],
  tea:['tea.webp','🫖 優雅なお茶の時間','紅茶でも飲んで待つにゃ。'],
  book:['book.webp','📖 読書中','知性は大切にゃ。'],
  stretch:['stretch.webp','🐈 のびのび中','背筋を伸ばすにゃ。'],
  sulk:['sulk.webp','😒 猫さまはご不満です','まだかにゃ……？'],
  bunny:['bunny.webp','🐰 1時間経過','待ちくたびれてしまったにゃ。'],
  chew:['chew.webp','🐰 2時間経過','うさぎに八つ当たりするにゃ……！'],
  bunny3:['bunny3.webp','⚠️ 3時間経過','こうなりたいのかにゃ？'],
  target4:['target4.webp','🎯 4時間経過','射的の練習でもするにゃ。'],
  doll5:['doll5.webp','🪆 5時間経過','下僕の人形を用意したにゃ。'],
  straw6:['straw6.webp','💢 6時間経過','藁人形まで登場したにゃ……。'],
  cry7:['cry7.webp','😭 7時間以上経過','もう待てないにゃぁぁ……！'],
  happy:['happy.webp','💖 猫さまはご機嫌です','よくやったにゃ♡ 褒めてつかわす！'],
  smug:['smug.webp','🏆 猫さまは得意げです','なかなかやるにゃ！'],
  praise_yareba:['praise_yareba_v6.webp','💜 猫さまの褒め言葉','やればできるじゃん'],
  praise_taihen:['praise_taihen_v6.webp','🏆 継続達成の特別賞','大変よくできました'],
  praise_keizoku:['praise_keizoku_v6.webp','✨ 猫さまの褒め言葉','継続は力なり！'],
  praise_marvelous:['praise_marvelous_v6.webp','🌟 猫さまの褒め言葉','天才、秀才、マーベラス！'],
  praise_turtle:['praise_turtle_v6.webp','🐢 猫さまの褒め言葉','一歩前進だにゃ'],
  praise_milk:['praise_milk_v6.webp','🥛 猫さまの褒め言葉','やるじゃん？'],
  praise_erai:['praise_erai_v6.webp','💖 猫さまの褒め言葉','えらいじゃん？'],
  praise_kiraku:['praise_kiraku_v6.webp','💤 猫さまの褒め言葉','まあ気楽に続けるにゃ']
};
let nekoSceneOverride='auto';
let currentPraiseScene = 'praise_yareba';
function nekoSceneNow(index){
 if(nekoSceneOverride!=='auto'&&NEKO_SCENES[nekoSceneOverride])return nekoSceneOverride;
 if(index===6)return currentPraiseScene;
 const active=pending();
 if(!active.length){
   const idle=['idle','groom','sleep','tea','book','stretch'];
   return idle[Math.floor(Date.now()/120000)%idle.length];
 }
 const minutes=Math.max(0,(Date.now()-Math.min(...active.map(dueAt)))/60000);
 if(minutes>=420)return 'cry7';
 if(minutes>=360)return 'straw6';
 if(minutes>=300)return 'doll5';
 if(minutes>=240)return 'target4';
 if(minutes>=180)return 'bunny3';
 if(minutes>=120)return 'chew';
 if(minutes>=60)return 'bunny';
 if(minutes>=20)return 'sulk';
 return minutes>=5?'sulk':'idle';
}
function changeCatImage(index){
 const key=nekoSceneNow(index),src='assets/'+NEKO_SCENES[key][0],cat=$('cat');
 if(cat.getAttribute('src')!==src)cat.src=src;
 cat.dataset.mood=key;
 return key;
}
function updateMood(){
 const index=preview>=0?preview:Date.now()<celebrateUntil?6:level();
 const key=changeCatImage(index),scene=NEKO_SCENES[key];
 $('mood').textContent=scene[1];
 const celebrating=Date.now()<celebrateUntil&&!!celebrateMessage;
 $('speech').textContent=celebrating&&key===currentPraiseScene?celebrateMessage:scene[2];

function showPraisePopup(praise){

// v9: Closing the praise popup must release the home-screen celebration immediately.
function endPraiseDisplay(){
 celebrateUntil=0;
 celebrateMessage='';
 preview=-1;
 nekoSceneOverride='auto';
 const demo=$('neko-demo-scene');

$('neko-praise-popup-close').addEventListener('click',()=>$('neko-praise-dialog').close());
$('neko-praise-dialog').addEventListener('close',endPraiseDisplay);
window.addEventListener('pageshow',()=>{if(!$('neko-praise-dialog').open&&Date.now()>=celebrateUntil)updateMood()});

function render(){
 const list=$('list');list.replaceChildren();const current=activeTasks();$('count').textContent=current.filter(t=>!completedToday(t)).length;
 if(!current.length){const p=document.createElement('p');p.className='empty';p.textContent=tasks.length?'今日の任務は完了にゃ ✨ 繰り返しタスクは次の予定日に戻るよ。':'任務はすべて完了にゃ ✨';list.append(p)}
 current.forEach(t=>{
 const row=document.createElement('div');row.className='task';const info=document.createElement('div');info.className='info';const name=document.createElement('strong');name.textContent=t.text;
 const time=document.createElement('small');const repeats={once:'1回だけ',daily:'毎日',weekdays:'平日のみ',weekly:'毎週 '+['日','月','火','水','木','金','土'][Number(t.weekday)||0]+'曜日'};
 let label='🔁 '+(repeats[t.repeat||'once']||'1回だけ');if(t.deadline){
   const dt=new Date(dueAt(t));
   const hm=dt.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
   label+=(t.repeat!=='once'&&t.repeat!=='once-done'?' ・⏰ 毎回 '+hm:' ・⏰ '+dt.toLocaleString('ja-JP'));
 }else label+=' ・締切なし';time.textContent=label;
 info.append(name,time);
const done=document.createElement('button');
done.textContent=completedToday(t)?'🌸 本日完了':'✓ 完了';
done.onclick=()=>{
  if(completedToday(t)){
    // 完了取り消し時は達成履歴からも本日分を除く。
    t.doneHistory=completedDates(t).filter(day=>day!==dateKey());
    t.lastDone=null;
    save();
    render();
    return;
  }
  if(t.repeat&&t.repeat!=='once'){
    t.lastDone=dateKey();
    t.doneHistory=Array.isArray(t.doneHistory)?t.doneHistory:[];
    if(!t.doneHistory.includes(t.lastDone)){
      t.doneHistory.push(t.lastDone);
    }
  }else{
    t.lastDone=dateKey();
    t.repeat='once-done';
  }
  const praise=praiseFor(t);
  celebrateMessage=praise.text;
  currentPraiseScene=praise.key;
  nekoSceneOverride='auto';

function completedScheduledDates(t){

 return completedDates(t).filter(key=>{
   if(key<created||key>today)return false;
   const d=new Date(key+'T12:00:00');

function stats30(t){

 const time=t.deadline?new Date(t.deadline):null;
 const now=new Date();
 let expected=0,completed=0;
 for(let i=0;i<30;i++){
   const d=new Date(today);d.setDate(today.getDate()-i);
   const key=dateKey(d);
   if(key<created||!isRepeatDay(t,d))continue;
   const alreadyDone=done.has(key);
   if(i===0 && !alreadyDone && time && !Number.isNaN(time.getTime())){
     const due=new Date(now);
     due.setHours(time.getHours(),time.getMinutes(),0,0);
     if(now<due)continue;
   }
   expected++;
   if(alreadyDone)completed++;

}

   if(done.has(dateKey(day))){run++;best=Math.max(best,run)}else run=0;
 }
 return best;
}

<script>
(() => {
  'use strict';
  const CLOUD_SERVER = 'https://neko-kantoku-push.nekosama.workers.dev';
  const OWNER_STORAGE_KEY = 'nekoOwnerKeyV1';
  let timer = null;
  let syncing = false;
  let needsSync = false;

  const syncLabel = document.createElement('small');
  syncLabel.id = 'neko-cloud-sync';
  syncLabel.style.display = 'block';
  syncLabel.style.marginTop = '8px';
  syncLabel.textContent = '☁️ クラウド同期：未確認';
  document.getElementById('status')?.insertAdjacentElement('afterend', syncLabel);
  const show = message => { syncLabel.textContent = '☁️ ' + message; };

  function getOwnerKey() {
    let key = localStorage.getItem(OWNER_STORAGE_KEY);
    if (key && /^[a-f0-9]{64}$/.test(key)) return key;
    const bytes = crypto.getRandomValues(new Uint8Array(32));
    key = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    localStorage.setItem(OWNER_STORAGE_KEY, key);
    return key;
  }

  async function syncNow() {
    if (syncing) { needsSync = true; return; }
    syncing = true;
    try {
      if (!('serviceWorker' in navigator)) {
        show('この端末では利用できません');
        return;
      }
      const registration = await navigator.serviceWorker.getRegistration();
      const subscription = await registration?.pushManager?.getSubscription();
      if (!subscription) {
        show('通知を有効にすると同期できます');
        return;
      }
      // 元のタスクをサーバー上書きで消さないよう、未作成・読込不能時は送らない。
      if (localStorage.getItem('nekoQueenV5') === null &&
          localStorage.getItem('nekoQueenV3') === null) {
        show('タスクを登録すると同期できます');
        return;
      }
      const payload = {
        ownerKey: getOwnerKey(),
        subscription: subscription.toJSON(),
        tasks: tasks.map(t => ({
          id: t.id,
          repeat: t.repeat || 'once',
          dueAt: Number.isFinite(dueAt(t)) ? dueAt(t) : Date.now(),
          weekday: Number.isInteger(Number(t.weekday)) &&
            Number(t.weekday) >= 0 && Number(t.weekday) <= 6 ? Number(t.weekday) : 0,
          lastDone: t.lastDone || null
        }))
      };
      const response = await fetch(CLOUD_SERVER + '/sync-tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (!response.ok || !result.success) {
        throw new Error(result.error || `HTTP ${response.status}`);
      }
      show(`同期成功（${result.synced}件）`);
    } catch (error) {
      console.error('猫さまクラウド同期エラー', error);
      show('同期失敗：' + error.message);
    } finally {
      syncing = false;
      if (needsSync) { needsSync = false; queueSync(); }
    }
  }

  function queueSync() {
    clearTimeout(timer);
    timer = setTimeout(syncNow, 900);
  }

  // 元の保存処理を維持したまま同期を追加する。
  const originalSave = save;
  save = function () {
    originalSave();
    queueSync();
  };

  window.addEventListener('load', () => setTimeout(queueSync, 3000));
  // 通知の有効化が終わった後でも同期できるよう複数回確認する。
  document.getElementById('enable')?.addEventListener('click', () => {
    setTimeout(queueSync, 1500);
    setTimeout(queueSync, 5000);
  });
  // 繰り返しタスクの対象日が変わった場合にも同期する。
  setInterval(queueSync, 10 * 60 * 1000);
})();

   report(step,'通知登録に成功しました。同期結果はこの下の「☁️」欄で確認できます');
  }catch(error){
   console.error('猫さま通知診断 '+step,error);
   report(step,'失敗：'+messageFrom(error));
  }finally{button.disabled=false;}
 });
})();
</script>
